# main 更新且檢查通過後，自動發布到 GitHub Pages（手機打開網址即可安裝 PWA）。
# 第一次使用前，請到 GitHub 專案 Settings → Pages，把 Source 設為「GitHub Actions」。
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: 只打包網站需要的檔案
        run: |
          mkdir _site
          cp -r index.html manifest.webmanifest sw.js icon.svg icon-192.png icon-512.png src styles _site/
          rm -rf _site/src/types
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
